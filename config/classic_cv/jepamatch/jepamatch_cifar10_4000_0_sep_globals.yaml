algorithm: jepamatch
save_dir: ./saved_models/classic_cv
save_name: jepamatch_cifar10_4000_0_sep_globals
resume: False
load_path: ""
overwrite: True
use_tensorboard: True
use_wandb: False
epoch: 100
num_train_iter: 100000
num_eval_iter: 2000
num_log_iter: 1000
num_labels: 4000
batch_size: 64
eval_batch_size: 256
hard_label: True
T: 0.5
thresh_warmup: True
p_cutoff: 0.95
ulb_loss_ratio: 1.0
uratio: 7
ema_m: 0.999
crop_ratio: 0.875
img_size: 32
optim: SGD
lr: 0.03
momentum: 0.9
weight_decay: 0.0005
layer_decay: 1.0
amp: False
clip_grad: 5.0
use_cat: True
use_refix: False
net: wrn_28_2
net_from_name: False
data_dir: ./data
dataset: cifar10
train_sampler: RandomSampler
num_classes: 10
num_workers: 2
seed: 0
world_size: 1
rank: 0
multiprocessing_distributed: False
dist_url: tcp://127.0.0.1:10202
dist_backend: nccl
gpu: None

# Experiment 4 (4-experiment comparison): pseudo-labeling uses standard FixMatch weak/strong
# (unchanged), but the representation loss uses a FULLY SEPARATE pair of global crops
# (x_ulb_g) instead of reusing weak/strong -- weak/strong and the representation loss
# share nothing. Tests whether reusing weak/strong (cheaper) costs any accuracy vs.
# this fully-decoupled, more expensive design.
weak_strong_source: fixmatch   # standard FixMatch/FlexMatch recipe: weak = mild flip+crop, strong = RandAugment(3,5)
global_source: separate        # representation loss uses independent global crops, not weak/strong
num_global: 2
scale_g: [0.5, 1.0]            # global crop scale range, per spec

# JEPAMatch-specific: Representation Level hyperparameters.
beta: 0.2               # SIGReg balance within the representation loss
lambda_rep: 0.5         # representation loss weight in the total loss
warmup_ratio: 0.75      # fraction of training spent in the SIGReg warmup phase (paper calls this T_warm / T)
centroid_mean: local    # JEPA prediction-loss target: "local" = mean of the K local crops; "global" = mean of the global (weak + strong) views
sigreg_views: local     # views (Adaptive Class-wise) SIGReg regularizes: "local" = local crops only; "all" = weak + strong + local (the paper's 3 view types)
save_train_info: True   # dump per-step pseudo-labeling diagnostics

# JEPAMatch multi-view augmentation (semilearn/algorithms/jepamatch, semilearn/datasets/cv_datasets/cifar.py)
num_local: 6
local_size: 20
scale_l: [0.2, 0.5]
