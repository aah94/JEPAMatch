algorithm: jepamatch
save_dir: ./saved_models/classic_cv
save_name: jepamatch_cifar10_4000_0_ws_lejepa
resume: False
load_path: ""
overwrite: True
use_tensorboard: True
use_wandb: False
epoch: 100
num_train_iter: 100000
num_eval_iter: 2000
num_log_iter: 1000
num_labels: 4000
batch_size: 64
eval_batch_size: 256
hard_label: True
T: 0.5
thresh_warmup: True
p_cutoff: 0.95
ulb_loss_ratio: 1.0
uratio: 7
ema_m: 0.999
crop_ratio: 0.875
img_size: 32
optim: SGD
lr: 0.03
momentum: 0.9
weight_decay: 0.0005
layer_decay: 1.0
amp: False
clip_grad: 5.0
use_cat: True
use_refix: False
net: wrn_28_2
net_from_name: False
data_dir: ./data
dataset: cifar10
train_sampler: RandomSampler
num_classes: 10
num_workers: 2
seed: 0
world_size: 1
rank: 0
multiprocessing_distributed: False
dist_url: tcp://127.0.0.1:10102
dist_backend: nccl
gpu: None

# Experiment: weak/strong augmentation source comparison (this run = 'lejepa').
# See jepamatch_cifar10_4000_0_ws_fixmatch.yaml for the baseline arm.
weak_strong_source: lejepa      # weak = large-scale crop (scale_weak), strong = small-scale crop (scale_strong), both via the local-crop-style augmentation
scale_weak: [0.8, 1.0]        # global weak: large crop portion
scale_strong: [0.5, 0.8]       # global strong: smaller crop portion

# JEPAMatch-specific: Representation Level hyperparameters.
beta: 0.2               # SIGReg balance within the representation loss
lambda_rep: 0.5         # representation loss weight in the total loss
warmup_ratio: 0.75      # fraction of training spent in the SIGReg warmup phase (paper calls this T_warm / T)
centroid_mean: local    # JEPA prediction-loss target: "local" = mean of the K local crops; "global" = mean of the global (weak + strong) views
sigreg_views: local     # views (Adaptive Class-wise) SIGReg regularizes: "local" = local crops only; "all" = weak + strong + local (the paper's 3 view types)
save_train_info: True   # dump per-step pseudo-labeling diagnostics

# JEPAMatch multi-view augmentation (semilearn/algorithms/jepamatch, semilearn/datasets/cv_datasets/cifar.py)
num_local: 6
local_size: 20
scale_l: [0.2, 0.5]
