algorithm: jepamatch
save_dir: ./saved_models/classic_cv
save_name: jepamatch_cifar100_400_0
resume: False
load_path: ""
overwrite: True
use_tensorboard: True
use_wandb: False
epoch: 128
num_train_iter: 131072
num_eval_iter: 5120
num_log_iter: 256
num_labels: 400
batch_size: 64
eval_batch_size: 256
hard_label: True
T: 0.5
thresh_warmup: True
p_cutoff: 0.95
ulb_loss_ratio: 1.0
uratio: 7
ema_m: 0.999
crop_ratio: 0.875
img_size: 32
optim: SGD
lr: 0.03
momentum: 0.9
weight_decay: 0.001
layer_decay: 1.0
amp: False
clip_grad: 5.0
use_cat: True
use_refix: False
net: wrn_28_8
net_from_name: False
data_dir: ./data
dataset: cifar100
train_sampler: RandomSampler
num_classes: 100
num_workers: 1
seed: 0
world_size: 1
rank: 0
multiprocessing_distributed: True
dist_url: tcp://127.0.0.1:10001
dist_backend: nccl
gpu: None

# JEPAMatch-specific (paper Sec. 4/5): Representation Level hyperparameters.
beta: 0.2               # SIGReg balance within the representation loss
lambda_rep: 0.5         # representation loss weight in the total loss
warmup_ratio: 0.25      # fraction of training spent in the SIGReg warmup phase (paper calls this T_warm / T)
centroid_mean: local    # JEPA prediction-loss target: "local" = mean of the K local crops; "global" = mean of the global (weak + strong) views
sigreg_views: local     # views (Adaptive Class-wise) SIGReg regularizes: "local" = local crops only; "all" = weak + strong + local (the paper's 3 view types)
save_train_info: True   # dump per-step pseudo-labeling diagnostics (paper's PLA/PLQ/MCC figures)

# JEPAMatch multi-view augmentation (semilearn/algorithms/jepamatch, semilearn/datasets/cv_datasets/cifar.py)
num_local: 6
local_size: 20
scale_l: [0.2, 0.5]
